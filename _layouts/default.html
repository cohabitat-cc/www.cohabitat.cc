<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'fr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% include seo.html %}

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">


</head>
<body class="site-body">
  {% include navbar.html %}

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-container footer-content">
      <div class="footer-links">
        <a href="{{ '/' | relative_url }}">Accueil</a>
        <span class="footer-separator">•</span>
        <a href="{{ '/a-propos/' | relative_url }}">À propos</a>
        <span class="footer-separator">•</span>
        <a href="{{ '/membres/' | relative_url }}">Membres</a>
        <span class="footer-separator">•</span>
        <a href="{{ '/blogue/' | relative_url }}">Blogue</a>
        <span class="footer-separator">•</span>
        <a href="mailto:joindre@cohabitat.cc">Contact</a>
      </div>
      <p>&copy; {{ 'now' | date: "%Y" }} <strong>COHABITAT.CC</strong> — Organisme sans but lucratif.</p>
      {% include social-icons.html %}
    </div>
  </footer>
</body>
</html>
